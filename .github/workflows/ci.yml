name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Host unit tests
        run: bash tests/host/run_tests.sh
      - name: Source encoding check (UTF-8, GBK only as \x escapes)
        run: python3 tools/fix_encoding.py --check User/*.[ch] System/*.[ch] Hardware/*.[ch]
      - name: Firmware syntax check (clang, Cortex-M3)
        run: bash tools/check_firmware_syntax.sh

  arm-gcc-build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { name: original, flags: "" }
          - { name: v2-board, flags: "V2=1" }
          - { name: lite,     flags: "LITE=1" }
    steps:
      - uses: actions/checkout@v5
      - name: Install ARM GCC
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build firmware
        run: make -j"$(nproc)" ${{ matrix.flags }}
      - uses: actions/upload-artifact@v4
        with:
          name: manbo-firmware-${{ matrix.name }}
          path: |
            build/manbo.hex
            build/manbo.bin
            build/manbo.map

  hardware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install generator deps
        run: python3 -m pip install --quiet numpy scipy
      - name: Regenerate boards, ERC + DRC, fail if committed files are stale
        run: |
          python3 hardware/gen/build.py --check
          python3 hardware/gen/build.py --check --variant lite

  kicad:
    # Real KiCad 8: ERC on the schematic, DRC (with zone refill) on the board
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install KiCad 8
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-8.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
      - name: ERC + DRC (V2 carrier and LITE board)
        run: |
          set -e
          for b in hardware/kicad/manbo-carrier hardware/lite/kicad/manbo-lite; do
            n=$(basename $b)
            kicad-cli sch erc --severity-error --exit-code-violations -o $n-erc.rpt $b.kicad_sch || (cat $n-erc.rpt; exit 1)
            kicad-cli pcb drc --schematic-parity --severity-error --exit-code-violations -o $n-drc.rpt $b.kicad_pcb || (cat $n-drc.rpt; exit 1)
            grep -h "Found" $n-erc.rpt $n-drc.rpt || true
            mkdir -p kicad-gerbers/$n
            kicad-cli pcb export gerbers -o kicad-gerbers/$n/ $b.kicad_pcb
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kicad-reports
          path: |
            *-erc.rpt
            *-drc.rpt
            kicad-gerbers/
