name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Host unit tests
        run: bash tests/host/run_tests.sh
      - name: Source encoding check (UTF-8, GBK only as \x escapes)
        run: python3 tools/fix_encoding.py --check User/*.[ch] System/*.[ch] Hardware/*.[ch]
      - name: Firmware syntax check (clang, Cortex-M3)
        run: bash tools/check_firmware_syntax.sh

  arm-gcc-build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        board: ["0", "1"]   # 0 = original wiring, 1 = MANBO_BOARD_V2 PCB
    steps:
      - uses: actions/checkout@v5
      - name: Install ARM GCC
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build firmware
        run: make -j"$(nproc)" V2=${{ matrix.board }}
      - uses: actions/upload-artifact@v4
        with:
          name: manbo-firmware-v2-${{ matrix.board }}
          path: |
            build/manbo.hex
            build/manbo.bin
            build/manbo.map

  hardware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install generator deps
        run: python3 -m pip install --quiet numpy scipy
      - name: Regenerate board, ERC + DRC, fail if committed files are stale
        run: python3 hardware/gen/build.py --check

  kicad:
    # Real KiCad 8: ERC on the schematic, DRC (with zone refill) on the board
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install KiCad 8
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-8.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
      - name: ERC
        run: |
          kicad-cli sch erc --severity-error --exit-code-violations \
            -o erc.rpt hardware/kicad/manbo-carrier.kicad_sch || (cat erc.rpt; exit 1)
          cat erc.rpt
      - name: DRC
        run: |
          kicad-cli pcb drc --schematic-parity --severity-error --exit-code-violations \
            -o drc.rpt hardware/kicad/manbo-carrier.kicad_pcb || (cat drc.rpt; exit 1)
          cat drc.rpt
      - name: Plot Gerbers with KiCad (cross-check)
        run: |
          mkdir -p kicad-gerbers
          kicad-cli pcb export gerbers -o kicad-gerbers/ hardware/kicad/manbo-carrier.kicad_pcb
          kicad-cli pcb export svg --layers F.Cu,B.Cu,F.SilkS,Edge.Cuts -o kicad-board.svg hardware/kicad/manbo-carrier.kicad_pcb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kicad-reports
          path: |
            erc.rpt
            drc.rpt
            kicad-gerbers/
            kicad-board.svg
